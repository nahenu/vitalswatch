name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # On failure, surface npm's own error lines as annotations on the run.
      - name: Install dependencies
        run: |
          npm ci 2>&1 | tee /tmp/npm-ci.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^npm (error|ERR!)" /tmp/npm-ci.log | head -8 | sed 's/^/::error title=npm ci::/'
          fi
          exit "$status"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # Playwright builds the app, starts it on its own port with a fresh
      # PGlite database, and runs the desktop and mobile suites.
      - name: Build and run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
